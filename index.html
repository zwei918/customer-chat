<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="客服小美，在线解答">
<title>客服小美</title>
<style>
  :root {
    --canvas: #f2f2f7;
    --surface: #ffffff;
    --ink: #1c1c1e;
    --ink-muted: #6e6e73;
    --fill: #e5e5ea;
    --hairline: rgba(60, 60, 67, 0.12);
    --action: #0a84ff;
    --action-press: #0071e8;
    --live: #30d158;
    --recording: #ff3b30;
    --bot-bubble: #ffffff;
    --user-bubble: #0a84ff;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  ::selection { background: rgba(10, 132, 255, 0.22); }
  :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .skip {
    position: absolute; left: 12px; top: -40px; z-index: 20;
    background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px;
    font-size: 13px; text-decoration: none;
  }
  .skip:focus { top: 12px; }
  #toast {
    display: none; position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px;
    border-radius: 980px; z-index: 10; max-width: min(90vw, 420px); text-align: center;
  }
  #toast.show { display: block; }
  #chat { scrollbar-color: var(--fill) transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--surface); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    overflow: hidden;
    position: fixed;
    inset: 0;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  header {
    background: var(--surface);
    color: var(--ink);
    padding: max(8px, env(safe-area-inset-top, 0px)) 16px 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 0 var(--hairline);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .header-text { flex: 1; min-width: 0; }
  .new-chat {
    flex-shrink: 0;
    background: var(--fill);
    color: var(--ink);
    border: none;
    border-radius: 980px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .new-chat:hover { background: #d8d8dc; }
  .new-chat:active { transform: scale(0.98); }
  .new-chat:disabled { opacity: .4; cursor: not-allowed; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--fill); color: var(--ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .icon-btn:hover { background: #d8d8dc; }
  .icon-btn:active { transform: scale(0.98); }
  .icon-btn[aria-expanded="true"] { background: #d8d8dc; }
  .hist-mask {
    display: none; position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 5;
  }
  .hist-mask.show { display: block; }
  .hist {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88%);
    background: var(--surface); border-left: 1px solid var(--hairline);
    z-index: 6; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .2s var(--ease);
  }
  .hist.open { transform: translateX(0); }
  .hist-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--hairline); flex-shrink: 0;
  }
  .hist-head h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .hist-list { flex: 1; overflow-y: auto; padding: 8px; }
  .hist-item {
    width: 100%; text-align: left; background: none; border-radius: 12px;
    padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    color: var(--ink); cursor: pointer;
  }
  .hist-item:hover { background: var(--canvas); }
  .hist-item.active { background: var(--fill); }
  .hist-item .t {
    font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hist-item .m { font-size: 12px; color: var(--ink-muted); grid-column: 1; }
  .hist-item .del {
    grid-row: 1 / span 2; grid-column: 2; align-self: center;
    width: 28px; height: 28px; border-radius: 50%; background: none; color: var(--ink-muted);
    display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
  }
  .hist-item .del:hover { background: var(--fill); color: var(--ink); }
  .hist-empty { padding: 40px 20px; text-align: center; color: var(--ink-muted); font-size: 13px; line-height: 1.5; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--fill); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; flex-shrink: 0; overflow: hidden;
  }
  .avatar img, .avatar-mini img {
    width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%;
  }
  .avatar.has-img, .avatar-mini.has-img { padding: 0; overflow: hidden; }
  .subtitle .dot.off { background: #8e8e93; }
  .title {
    font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .subtitle {
    font-size: 13px; color: var(--ink-muted); margin-top: 2px;
    display: flex; align-items: flex-start; gap: 6px;
    line-height: 1.35; min-width: 0;
  }
  .subtitle span:not(.dot) { min-width: 0; }
  .subtitle .dot { margin-top: 5px; }
  .subtitle .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); flex-shrink: 0;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 24px; background: var(--chat-bg, var(--canvas)); background-size: cover; background-position: center; }
  .msg { display: flex; margin-bottom: 14px; align-items: flex-end; gap: 8px; }
  .msg .avatar-mini {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    background: var(--fill); color: var(--ink);
  }
  .msg.user .avatar-mini { background: var(--action); color: #fff; }
  .msg .content { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user .content { align-items: flex-end; }
  .msg.cont .avatar-mini { visibility: hidden; }
  .msg .time { font-size: 11px; color: var(--ink-muted); padding: 0 4px; line-height: 1.2; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.2px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.bot { justify-content: flex-start; }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-top-left-radius: 4px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, .08);
  }
  .msg.user { justify-content: flex-start; flex-direction: row-reverse; }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .msg.bot .bubble.err {
    background: #fff5f5;
    border-color: rgba(255, 59, 48, 0.28);
    color: var(--ink);
  }
  .msg .attachment {
    background: var(--bot-bubble); border: 1px solid var(--hairline); border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 260px;
    position: relative;
  }
  .msg.user .attachment { background: rgba(255,255,255,.16); border-color: transparent; color: #fff; }
  .msg .attachment img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; }
  .msg .attachment.sending img { opacity: .72; }
  .msg .attachment .file-ico { font-size: 18px; flex-shrink: 0; opacity: .7; }
  .msg .attachment .file-name { font-size: 13px; word-break: break-all; }
  .msg .attachment audio { width: 200px; height: 36px; }
  .send-status { font-size: 11px; color: var(--ink-muted); }
  .msg.user .send-status { color: rgba(255,255,255,.9); }
  .msg .attachment.failed .send-status { color: #ff3b30; }
  .retry-send {
    margin-top: 2px; border: none; background: transparent; color: #ff3b30;
    font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline;
    padding: 0;
  }
  .msg.user .retry-send { color: #fff; }
  .csat { max-width: 360px; margin: 16px auto; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 14px; text-align: center; }
  .csat p { font-size: 14px; margin-bottom: 8px; }
  .csat button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hairline); background: var(--surface); margin: 0 4px; cursor: pointer; font: inherit; }
  .csat button:hover { background: var(--fill); }
  .guide { max-width: 86%; color: var(--ink); }
  .guide p { font-size: 15px; color: var(--ink); line-height: 1.5; margin: 0 0 8px; }
  .guide .sub { font-size: 13px; color: var(--ink-muted); }
  .qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .qs button {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
    border-radius: 980px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .qs button:hover { background: var(--fill); }
  .typing { opacity: .7; }
  .typing .dots::after { content: '…'; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  footer {
    padding: 10px 12px calc(10px + max(20px, env(safe-area-inset-bottom, 0px)));
    background: var(--surface);
    box-shadow: 0 -1px 0 var(--hairline);
    display: flex; gap: 8px; align-items: flex-end;
    flex-shrink: 0;
  }
  .tool-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--fill); color: var(--ink); cursor: pointer;
    flex-shrink: 0; transition: background .18s var(--ease), transform .18s var(--ease), color .18s var(--ease);
    display: flex; align-items: center; justify-content: center;
  }
  #btnVoice { touch-action: none; -webkit-user-select: none; user-select: none; }
  .tool-btn svg { width: 18px; height: 18px; display: block; }
  .tool-btn:hover { background: #d8d8dc; }
  .tool-btn:active { transform: scale(0.98); }
  .tool-btn.recording { background: var(--recording); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #input {
    flex: 1; border: 1px solid transparent; border-radius: 980px;
    box-sizing: border-box; height: 36px; min-height: 36px;
    padding: 7px 14px; font-size: 16px; outline: none;
    resize: none; max-height: 120px; line-height: 22px;
    font-family: inherit; background: var(--fill); color: var(--ink);
  }
  #input::placeholder { color: var(--ink-muted); }
  #input:focus { border-color: var(--action); background: var(--surface); }
  #send {
    background: var(--action); color: #fff; border: none;
    border-radius: 980px; height: 36px; padding: 0 16px; font-size: 15px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
    transition: background .18s var(--ease), transform .18s var(--ease), opacity .18s var(--ease);
  }
  #send:hover { background: var(--action-press); }
  #send:active { transform: scale(0.98); }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #pending {
    display: none; background: var(--surface); border-top: 1px solid var(--hairline);
    padding: 8px 16px; font-size: 13px; color: var(--ink); gap: 8px; align-items: center;
    flex-wrap: wrap; flex-shrink: 0;
  }
  #pending.show { display: flex; }
  .pending-item {
    background: var(--fill); color: var(--ink); border-radius: 980px; padding: 4px 12px;
    font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  }
  .pending-item .x { cursor: pointer; font-weight: 600; color: var(--ink-muted); }
  .pending-item .x:hover { color: var(--ink); }
  @media (max-width: 480px) {
    .msg .content { max-width: 86%; }
    .msg .bubble { font-size: 16px; }
    .new-chat { padding: 7px 10px; font-size: 12px; }
    footer { gap: 6px; }
    .tool-btn { width: 34px; height: 34px; }
    #send { padding: 9px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool-btn.recording { animation: none; }
    .typing .dots::after { animation: none; }
    .hist { transition: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#input">跳到输入框</a>
<div class="app">
  <header>
    <div class="avatar" id="brandAvatar">美</div>
    <div class="header-text">
      <div class="title" id="brandTitle">客服小美</div>
      <div class="subtitle" id="brandStatus"><span class="dot" aria-hidden="true"></span>在线 · 图片 / 文件 / 语音</div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="btnHist" title="对话记录" aria-label="对话记录" aria-controls="hist" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4.5" width="16" height="6" rx="1.8"/><rect x="4" y="13.5" width="16" height="6" rx="1.8"/></svg>
      </button>
      <button type="button" class="new-chat" id="btnNew" title="开始新对话，当前记录会留在列表里">新对话</button>
    </div>
  </header>
  <div id="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
  <div id="pending"></div>
  <footer>
    <button class="tool-btn" id="btnImg" title="发图片" aria-label="发图片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="10" r="1.4"/><path d="M7 16.5l3.2-3.4 2.3 2.2 2.4-2.8 3.6 4"/></svg>
    </button>
    <button class="tool-btn" id="btnFile" title="发文件" aria-label="发文件">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5l-6.2 6.2a3.2 3.2 0 0 0 4.5 4.5l6.4-6.4a4.6 4.6 0 0 0-6.5-6.5L6.4 10.6"/></svg>
    </button>
    <button class="tool-btn" id="btnVoice" title="按住说话" aria-label="按住说话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.5"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="请输入你的问题" enterkeyhint="send" maxlength="4000" aria-label="消息"></textarea>
    <button id="send" type="button">发送</button>
    <input type="file" id="fileImg" accept="image/*" hidden>
    <input type="file" id="fileAny" hidden>
  </footer>
  <div class="hist-mask" id="histMask"></div>
  <aside class="hist" id="hist" aria-label="对话记录">
    <div class="hist-head">
      <h2>对话记录</h2>
      <button type="button" class="icon-btn" id="histClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="hist-list" id="histList"></div>
  </aside>
</div>
<div id="toast" role="status"></div>

<script>
// 键盘弹出时收起顶栏、高度跟 visualViewport；收起后清掉行内高度，让 .app 铺满 fixed body。
(function fitKeyboard() {
  const app = document.querySelector('.app');
  const header = document.querySelector('header');
  const vv = window.visualViewport;
  if (!vv) return;
  const update = () => {
    const h = vv.height;
    const fullH = window.innerHeight;
    if (h >= fullH - 50) {
      app.style.height = '';
      header.style.display = '';
    } else {
      app.style.height = h + 'px';
      header.style.display = 'none';
    }
  };
  vv.addEventListener('resize', update);
  window.addEventListener('resize', update);
  update();
})();

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const pendingEl = document.getElementById('pending');
const btnImg = document.getElementById('btnImg');
const btnFile = document.getElementById('btnFile');
const btnVoice = document.getElementById('btnVoice');
const fileImg = document.getElementById('fileImg');
const fileAny = document.getElementById('fileAny');

let visitorId = localStorage.getItem('xiaomei_visitor');
if (!visitorId) { visitorId = crypto.randomUUID(); localStorage.setItem('xiaomei_visitor', visitorId); }
let sessionId = localStorage.getItem('xiaomei_session') || null;
let lastMsgId = 0;
let catchup = true;
let csatShown = false;
let pendingParts = [];   // [{type, attachment_id, filename, url?, kind}]
let mediaRec = null;
let recChunks = [];

// ---- 聊天记录本地保存（刷新恢复；多会话列表）----
const HISTORY_KEY = 'xiaomei_history';
const THREADS_KEY = 'xiaomei_threads';
const THREAD_ID_KEY = 'xiaomei_thread';
let history = [];
let threads = [];
let threadId = localStorage.getItem(THREAD_ID_KEY) || '';
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]') || []; } catch (e) { history = []; }
try { threads = JSON.parse(localStorage.getItem(THREADS_KEY) || '[]') || []; } catch (e) { threads = []; }

const toastEl = document.getElementById('toast');
const btnNew = document.getElementById('btnNew');
const btnHist = document.getElementById('btnHist');
const histEl = document.getElementById('hist');
const histMask = document.getElementById('histMask');
const histList = document.getElementById('histList');
let lastRole = '';
let toastTimer = 0;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ''; }, 2800);
}

function isErr(text) {
  return /服务异常|网络开小差|没有收到回复|上传失败|语音识别失败/i.test(text || '');
}

function clock(ts) {
  const d = ts ? new Date(ts) : new Date();
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function stamp(content, ts) {
  const t = document.createElement('div');
  t.className = 'time';
  t.textContent = clock(ts);
  content.appendChild(t);
}

let widget = { name: '客服小美', online: true, logo_url: '', visitor_avatar_url: '', chat_bg: '#f2f2f7', allow_image: true, allow_file: true, allow_voice: true, guide_text: '', guide_qs: [] };

function botMark() {
  if (widget.logo_url) return '<img src="' + esc(widget.logo_url) + '" alt="">';
  const n = (widget.name || '美').trim();
  return esc(n.slice(-1) || '美');
}

function visitorMark() {
  if (widget.visitor_avatar_url) return '<img src="' + esc(widget.visitor_avatar_url) + '" alt="">';
  return '我';
}

function applyChatBg(color) {
  const bg = color || '#f2f2f7';
  document.documentElement.style.setProperty('--chat-bg', bg);
  document.documentElement.style.setProperty('--bot-bubble', '#ffffff');
  const chat = document.getElementById('chat');
  chat.style.background = bg;
  const foot = document.querySelector('footer');
  if (foot) foot.style.background = '';
  const pending = document.getElementById('pending');
  if (pending) pending.style.background = '';
}

function applyWidget() {
  const name = widget.name || '客服小美';
  document.title = name;
  document.getElementById('brandTitle').textContent = name;
  const av = document.getElementById('brandAvatar');
  av.innerHTML = botMark();
  av.classList.toggle('has-img', !!widget.logo_url);
  const on = widget.online !== false;
  const lock = widget.online_lock !== false;
  const caps = [];
  if (widget.allow_image !== false) caps.push('图片');
  if (widget.allow_file !== false) caps.push('文件');
  if (widget.allow_voice !== false) caps.push('语音');
  const cap = caps.length ? caps.join(' / ') : '仅文字';
  document.getElementById('brandStatus').innerHTML =
    '<span class="dot' + (on ? '' : ' off') + '" aria-hidden="true"></span>' +
    (on ? (lock ? '在线 · 24小时 · ' + cap : '在线 · ' + cap) : '离线 · ' + cap);
  applyChatBg(widget.chat_bg);
  btnImg.style.display = widget.allow_image === false ? 'none' : '';
  btnFile.style.display = widget.allow_file === false ? 'none' : '';
  if (widget.allow_voice === false) btnVoice.style.display = 'none';
}

async function loadWidget() {
  try {
    const r = await fetch('/api/widget', { headers: { 'X-Visitor-Id': visitorId } });
    if (r.ok) Object.assign(widget, await r.json());
  } catch (e) {}
  applyWidget();
}

function threadTitle(items) {
  const u = (items || []).find(i => i.role === 'user' && (i.text || (i.attachments && i.attachments.length)));
  if (!u) return '新对话';
  if (u.text) return u.text.replace(/\s+/g, ' ').slice(0, 24);
  const a = (u.attachments || [])[0];
  if (a && a.kind === 'image') return '图片';
  if (a && a.kind === 'voice') return '语音';
  return a && a.filename ? a.filename : '新对话';
}

function persistThreads() {
  try { localStorage.setItem(THREADS_KEY, JSON.stringify(threads.slice(0, 30))); } catch (e) {}
  try {
    if (threadId) localStorage.setItem(THREAD_ID_KEY, threadId);
    else localStorage.removeItem(THREAD_ID_KEY);
  } catch (e) {}
}

function persistCurrent() {
  if (!history.length) return;
  if (!threadId) threadId = crypto.randomUUID();
  const rec = {
    id: threadId,
    sessionId: sessionId || null,
    title: threadTitle(history),
    updatedAt: Date.now(),
    messages: history.slice(-100),
  };
  const i = threads.findIndex(t => t.id === threadId);
  if (i >= 0) threads[i] = rec;
  else threads.unshift(rec);
  threads.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  persistThreads();
}

function relTime(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function closeHist() {
  histEl.classList.remove('open');
  histMask.classList.remove('show');
  btnHist.setAttribute('aria-expanded', 'false');
}

function openHist() {
  persistCurrent();
  renderHistList();
  histEl.classList.add('open');
  histMask.classList.add('show');
  btnHist.setAttribute('aria-expanded', 'true');
}

function renderHistList() {
  const list = threads.filter(t => (t.messages || []).length);
  if (!list.length) {
    histList.innerHTML = '<div class="hist-empty">还没有历史对话。<br>点「新对话」开始后，记录会出现在这里。</div>';
    return;
  }
  histList.innerHTML = list.map(t =>
    `<div class="hist-item${t.id === threadId ? ' active' : ''}" data-id="${esc(t.id)}">` +
    `<div class="t">${esc(t.title || '新对话')}</div>` +
    `<button type="button" class="del" data-del="${esc(t.id)}" aria-label="删除">×</button>` +
    `<div class="m">${esc(relTime(t.updatedAt))}</div></div>`
  ).join('');
}

function openThread(id) {
  if (busy) { toast('请等这条发完再切换'); return; }
  persistCurrent();
  const t = threads.find(x => x.id === id);
  if (!t) return;
  threadId = t.id;
  sessionId = t.sessionId || null;
  history = t.messages || [];
  if (sessionId) localStorage.setItem('xiaomei_session', sessionId);
  else localStorage.removeItem('xiaomei_session');
  persistThreads();
  saveHistory();
  pendingParts = [];
  renderPending();
  lastRole = '';
  chatEl.innerHTML = '';
  if (history.length) renderHistory();
  else showWelcome();
  closeHist();
}

function deleteThread(id) {
  if (busy) { toast('请等这条发完再删'); return; }
  threads = threads.filter(t => t.id !== id);
  persistThreads();
  if (id === threadId) {
    threadId = '';
    sessionId = null;
    history = [];
    localStorage.removeItem('xiaomei_session');
    saveHistory();
    showWelcome();
  }
  renderHistList();
}

function showWelcome() {
  lastRole = '';
  const name = widget.name || '客服小美';
  const raw = (widget.guide_text || '你好，我是{name}，有问题直接发给我就好。').replace(/\{name\}/g, name);
  const qs = (widget.guide_qs && widget.guide_qs.length) ? widget.guide_qs : [];
  chatEl.innerHTML =
    '<div class="guide" id="guide">' +
    '<p>' + esc(raw) + '</p>' +
    (qs.length ? '<div class="qs">' + qs.map(q =>
      '<button type="button" data-q="' + esc(q.q) + '">' + esc(q.label || q.q) + '</button>'
    ).join('') + '</div>' : '') +
    '</div>';
}

function newChat() {
  if (busy) { toast('请等这条发完再开新对话'); return; }
  persistCurrent();
  threadId = crypto.randomUUID();
  sessionId = null;
  lastMsgId = 0;
  catchup = true;
  csatShown = false;
  localStorage.removeItem('xiaomei_session');
  history = [];
  persistThreads();
  saveHistory();
  pendingParts = [];
  renderPending();
  showWelcome();
  closeHist();
  inputEl.focus();
}

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-100))); } catch (e) {}
  persistCurrent();
}

function renderHistory() {
  lastRole = '';
  history.forEach(item => {
    const content = addMsg(item.role, '');
    if (item.attachments) {
      item.attachments.forEach(a => {
        const el = document.createElement('div');
        el.className = 'attachment';
        if (a.kind === 'image') el.innerHTML = '<span class="file-name">图片</span>';
        else if (a.kind === 'voice') el.innerHTML = '<span class="file-name">语音</span>';
        else el.innerHTML = '<span class="file-name">' + esc(a.filename || '文件') + '</span>';
        content.appendChild(el);
      });
    }
    if (item.text) {
      const b = document.createElement('div');
      b.className = 'bubble' + (isErr(item.text) ? ' err' : '');
      b.textContent = item.text;
      content.appendChild(b);
    }
    stamp(content, item.at);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPending() {
  pendingEl.innerHTML = '';
  pendingEl.className = pendingParts.length ? 'show' : '';
  pendingParts.forEach((p, i) => {
    let label;
    if (p.uploading) label = '上传中';
    else if (p.kind === 'image') label = '图片';
    else if (p.kind === 'voice') label = '语音';
    else label = p.filename || '文件';
    const el = document.createElement('span');
    el.className = 'pending-item';
    el.innerHTML = esc(label) + '<span class="x" data-i="' + i + '" role="button" aria-label="移除">✕</span>';
    pendingEl.appendChild(el);
  });
  pendingEl.querySelectorAll('.x').forEach(x => x.onclick = () => {
    pendingParts.splice(+x.dataset.i, 1);
    renderPending();
  });
}

function addMsg(role, html) {
  const g = document.getElementById('guide');
  if (g) g.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (lastRole === role ? ' cont' : '');
  lastRole = role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar-mini';
  avatar.innerHTML = role === 'bot' ? botMark() : visitorMark();
  avatar.classList.toggle('has-img', role === 'bot' ? !!widget.logo_url : !!widget.visitor_avatar_url);
  const content = document.createElement('div');
  content.className = 'content';
  content.innerHTML = html;
  wrap.appendChild(avatar);
  wrap.appendChild(content);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return content;
}

function addTextBubble(role, text) {
  const content = addMsg(role, '');
  const b = document.createElement('div');
  b.className = 'bubble' + (isErr(text) ? ' err' : '');
  b.textContent = text;
  content.appendChild(b);
  stamp(content);
  return b;
}

function addTyping() {
  const content = addMsg('bot', '');
  const b = document.createElement('div');
  b.className = 'bubble dots';
  b.textContent = (widget.name || '客服') + '正在接入';
  content.appendChild(b);
  return content.parentElement;
}

function autoResize() {
  inputEl.style.height = '36px';
  inputEl.style.height = Math.min(Math.max(inputEl.scrollHeight, 36), 120) + 'px';
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const resp = await fetch('/api/upload', { method: 'POST', headers: { 'X-Visitor-Id': visitorId }, body: fd });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || !data.attachment_id) throw new Error(data.error || '上传失败');
  return data;
}

function apiParts(parts) {
  return (parts || []).map(p => {
    let type = p.type || 'file';
    if (p.kind === 'voice' || type === 'voice') type = 'record';
    if (p.kind === 'image') type = 'image';
    return { type, attachment_id: p.attachment_id, filename: p.filename };
  }).filter(p => p.attachment_id && (p.type === 'image' || p.type === 'file' || p.type === 'record'));
}

let busy = false;

function setBusy(on) {
  busy = on;
  sendEl.disabled = on;
  btnNew.disabled = on;
  btnImg.disabled = on;
  btnFile.disabled = on;
}

async function streamBot(text, parts) {
  const typingWrap = addTyping();
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Visitor-Id': visitorId },
      body: JSON.stringify({ message: text || '', parts: apiParts(parts), session_id: sessionId }),
    });
    if (!resp.ok || !resp.body) {
      typingWrap.remove();
      addTextBubble('bot', '服务异常（' + resp.status + '），请稍后再试');
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let answer = '';
    let answerBubble = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const jsonStr = line.slice(5).trim();
        if (!jsonStr) continue;
        let evt;
        try { evt = JSON.parse(jsonStr); } catch (e) { continue; }
        if (evt.type === 'session_id' && evt.session_id) {
          sessionId = evt.session_id;
          localStorage.setItem('xiaomei_session', sessionId);
          catchup = true;
          lastMsgId = 0;
        } else if (evt.type === 'plain' && typeof evt.data === 'string') {
          if (!answerBubble) {
            typingWrap.remove();
            const c = addMsg('bot', '');
            answerBubble = document.createElement('div');
            answerBubble.className = 'bubble';
            c.appendChild(answerBubble);
            stamp(c);
          }
          answer += evt.data;
          answerBubble.textContent = answer;
          if (isErr(answer)) answerBubble.classList.add('err');
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (evt.type === 'handoff') {
          typingWrap.remove();
          if (evt.data) {
            addTextBubble('bot', evt.data);
            history.push({ role: 'bot', text: evt.data, attachments: [], at: Date.now() });
            saveHistory();
          }
        } else if (evt.type === 'end') {
          if (!answerBubble) {
            typingWrap.remove();
            addTextBubble('bot', '暂时没有收到回复，请稍后再试');
          }
          break;
        }
      }
    }
    if (answerBubble) {
      history.push({ role: 'bot', text: answer, attachments: [], at: Date.now() });
      saveHistory();
    }
  } catch (e) {
    typingWrap.remove();
    addTextBubble('bot', '网络不可用，请检查后重试');
  } finally {
    if (typingWrap.parentNode) typingWrap.remove();
    inputEl.focus();
  }
}

function paintUserAttachment(kind, file, url) {
  const att = document.createElement('div');
  att.className = 'attachment sending';
  if (kind === 'image' && url) att.innerHTML = '<img src="' + url + '" alt="图片"><span class="send-status">发送中</span>';
  else if (kind === 'voice' && url) att.innerHTML = '<audio controls src="' + url + '"></audio><span class="send-status">发送中</span>';
  else att.innerHTML = '<span class="file-name">' + esc(file.name || '文件') + '</span><span class="send-status">发送中</span>';
  return att;
}

async function sendFileNow(file, kind) {
  if (busy) { toast('请等这条发完'); return; }
  setBusy(true);
  const url = (kind === 'image' || kind === 'voice') ? URL.createObjectURL(file) : '';
  const content = addMsg('user', '');
  const att = paintUserAttachment(kind, file, url);
  content.appendChild(att);
  stamp(content);
  chatEl.scrollTop = chatEl.scrollHeight;
  try {
    const data = await uploadFile(file);
    att.classList.remove('sending');
    const st = att.querySelector('.send-status');
    if (st) st.remove();
    history.push({ role: 'user', text: '', attachments: [{ kind, filename: file.name }], at: Date.now() });
    saveHistory();
    await streamBot('', [{
      type: data.type || (kind === 'image' ? 'image' : 'file'),
      attachment_id: data.attachment_id,
      filename: file.name,
      kind,
    }]);
  } catch (e) {
    att.classList.remove('sending');
    att.classList.add('failed');
    const st = att.querySelector('.send-status');
    if (st) st.textContent = '发送失败';
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'retry-send';
    retry.textContent = '重发';
    retry.onclick = () => {
      const wrap = att.closest('.msg');
      if (wrap) wrap.remove();
      if (url) URL.revokeObjectURL(url);
      sendFileNow(file, kind);
    };
    att.appendChild(retry);
    toast(e.message || '上传失败');
  } finally {
    setBusy(false);
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  inputEl.value = '';
  autoResize();
  setBusy(true);
  const content = addMsg('user', '');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  content.appendChild(b);
  stamp(content);
  history.push({ role: 'user', text, attachments: [], at: Date.now() });
  saveHistory();
  chatEl.scrollTop = chatEl.scrollHeight;
  try {
    await streamBot(text, []);
  } finally {
    setBusy(false);
  }
}

btnImg.onclick = () => fileImg.click();
fileImg.onchange = () => {
  const file = fileImg.files[0];
  fileImg.value = '';
  if (file) sendFileNow(file, 'image');
};

btnFile.onclick = () => fileAny.click();
fileAny.onchange = () => {
  const file = fileAny.files[0];
  fileAny.value = '';
  if (file) sendFileNow(file, 'file');
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let speechRec = null;
let speechFinal = '';
let speechInterim = '';
let speechHolding = false;
let speechWantSend = false;
const SPEECH_ERR = {
  'not-allowed': '没有麦克风权限，请在浏览器设置里允许',
  'no-speech': '没有听清，请再试一次',
  'audio-capture': '找不到麦克风',
  'network': '语音识别需要网络',
};

function paintVoiceIdle() {
  btnVoice.classList.remove('recording');
  btnVoice.title = '按住说话';
  btnVoice.setAttribute('aria-label', '按住说话');
}

function paintVoiceLive() {
  btnVoice.classList.add('recording');
  btnVoice.title = '松开结束';
  btnVoice.setAttribute('aria-label', '松开结束');
}

function initSpeech() {
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) speechFinal += r[0].transcript;
      else interim += r[0].transcript;
    }
    speechInterim = interim;
    inputEl.value = (speechFinal + (interim ? ' ' + interim : '')).trim();
    autoResize();
  };
  rec.onend = () => {
    if (speechHolding) {
      try { rec.start(); } catch (err) {}
      return;
    }
    const said = (speechFinal || speechInterim).trim();
    speechRec = null;
    paintVoiceIdle();
    if (speechWantSend && said) {
      inputEl.value = said;
      send();
    } else if (speechWantSend && !said) {
      toast('没有听清，请按住再说一次');
    }
    speechWantSend = false;
    speechFinal = '';
    speechInterim = '';
  };
  rec.onerror = e => {
    if (e.error === 'aborted' || e.error === 'no-speech') return;
    speechHolding = false;
    speechWantSend = false;
    speechRec = null;
    paintVoiceIdle();
    toast(SPEECH_ERR[e.error] || ('语音识别失败：' + e.error));
  };
  return rec;
}

function startSpeech(e) {
  if (busy) { toast('请等这条发完'); return; }
  if (!SpeechRecognition) {
    toast('当前浏览器不支持语音，请用 Chrome 打开');
    return;
  }
  speechHolding = true;
  speechWantSend = false;
  speechFinal = '';
  speechInterim = '';
  if (e && e.pointerId != null) {
    try { btnVoice.setPointerCapture(e.pointerId); } catch (err) {}
  }
  if (!speechRec) speechRec = initSpeech();
  try {
    speechRec.start();
    paintVoiceLive();
  } catch (err) {
    try {
      speechRec.stop();
      setTimeout(() => { if (speechHolding && speechRec) { try { speechRec.start(); paintVoiceLive(); } catch (x) {} } }, 80);
    } catch (x) {}
  }
}

function stopSpeech(wantSend) {
  speechHolding = false;
  speechWantSend = !!wantSend;
  if (speechRec) {
    try { speechRec.stop(); } catch (e) {}
  } else {
    paintVoiceIdle();
  }
}

btnVoice.addEventListener('pointerdown', e => {
  if (e.button != null && e.button !== 0) return;
  e.preventDefault();
  startSpeech(e);
});
btnVoice.addEventListener('pointerup', () => stopSpeech(true));
btnVoice.addEventListener('pointercancel', () => stopSpeech(false));
btnVoice.addEventListener('lostpointercapture', () => { if (speechHolding) stopSpeech(true); });
btnVoice.addEventListener('contextmenu', e => e.preventDefault());
if (!SpeechRecognition) {
  btnVoice.title = '当前浏览器不支持语音';
}

btnNew.addEventListener('click', newChat);
btnHist.addEventListener('click', () => histEl.classList.contains('open') ? closeHist() : openHist());
document.getElementById('histClose').addEventListener('click', closeHist);
histMask.addEventListener('click', closeHist);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHist(); });
histList.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); deleteThread(del.dataset.del); return; }
  const item = e.target.closest('[data-id]');
  if (item) openThread(item.dataset.id);
});
sendEl.addEventListener('click', send);
chatEl.addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (!q) return;
  inputEl.value = q.dataset.q;
  send();
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', autoResize);

async function pollThread() {
  if (!sessionId) return;
  try {
    const r = await fetch('/api/thread?session_id=' + encodeURIComponent(sessionId) + '&after=' + lastMsgId, {
      headers: { 'X-Visitor-Id': visitorId }
    });
    if (!r.ok) return;
    const data = await r.json();
    const rows = data.data || [];
    if (catchup) {
      lastMsgId = rows.reduce((m, x) => Math.max(m, x.id || 0), lastMsgId);
      catchup = false;
      if (data.status === 'resolved' && !csatShown) showCsat();
      return;
    }
    for (const m of rows) {
      lastMsgId = Math.max(lastMsgId, m.id || 0);
      if (m.sender_type === 'agent' || m.sender_type === 'system') {
        addTextBubble('bot', m.content || '');
        history.push({ role: 'bot', text: m.content || '', attachments: [], at: Date.now() });
        saveHistory();
      }
    }
    if (data.status === 'resolved' && !csatShown) showCsat();
  } catch (e) {}
}

function showCsat() {
  csatShown = true;
  if (document.getElementById('csat')) return;
  const box = document.createElement('div');
  box.className = 'csat';
  box.id = 'csat';
  box.innerHTML = '<p>对这次人工服务还满意吗？</p>' + [1,2,3,4,5].map(n => '<button type="button" data-score="'+n+'">'+n+'</button>').join('');
  chatEl.appendChild(box);
  box.querySelectorAll('button').forEach(b => b.onclick = async () => {
    try {
      await fetch('/api/csat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Visitor-Id': visitorId },
        body: JSON.stringify({ session_id: sessionId, score: Number(b.dataset.score) })
      });
    } catch (e) {}
    box.innerHTML = '<p>谢谢你的评价</p>';
  });
}

setInterval(pollThread, 3000);

(async () => {
  await loadWidget();
  if (history.length && !threads.length) {
    threadId = threadId || crypto.randomUUID();
    threads = [{ id: threadId, sessionId, title: threadTitle(history), updatedAt: Date.now(), messages: history }];
    persistThreads();
  }
  if (threadId) {
    const t = threads.find(x => x.id === threadId);
    if (t && t.messages && t.messages.length) history = t.messages;
  }
  if (history.length) {
    const deduped = [];
    for (const item of history) {
      if (item.role === 'bot' && deduped.length && deduped[deduped.length - 1].role === 'bot') {
        deduped[deduped.length - 1] = item;
      } else {
        deduped.push(item);
      }
    }
    if (deduped.length !== history.length) {
      history = deduped;
      saveHistory();
    }
    renderHistory();
  } else {
    showWelcome();
  }
})();
